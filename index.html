<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tommy Guo's developer portfolio.">
  <meta name="theme-color" content="#ffffff">
  <title>Tommy Guo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #fff;
      color: #373737;
      font-family: "Space Mono", monospace;
    }

    main {
      width: 100%;
      height: 100%;
      height: 100svh;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .intro {
      width: 100%;
      min-width: 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 64px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    p {
      margin: 12px 0 0;
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.6;
      color: #747474;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      appearance: none;
      background: #fff;
      color: #555;
      border: 1px solid #dedede;
      border-radius: 5px;
      padding: 10px 15px;
      font: inherit;
      font-size: 13px;
      line-height: 1.4;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: #eee;
    }

    .social:hover {
      background: #f6f6f6;
      border-color: #aaa;
    }

    .social:focus-visible {
      outline: 2px solid #555;
      outline-offset: 4px;
    }

    @media (max-width: 360px) {
      nav {
        gap: 8px;
      }

      .social {
        padding-inline: 12px;
      }
    }

    @media (max-height: 400px) {
      p {
        margin-top: 8px;
      }

      nav {
        margin-top: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="intro">
      <h1>Tommy Guo</h1>
      <p>i like to make things.</p>

      <nav aria-label="Social links">
        <a class="social"
           href="https://github.com/tommy-guo"
           target="_blank"
           rel="noopener noreferrer">GitHub</a>

        <a class="social"
           href="mailto:tommyguo77@gmail.com">Email</a>

        <a class="social"
           href="https://www.linkedin.com/in/tommy-guo/"
           target="_blank"
           rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>
  </main>
</body>
</html>
